      value: ""
      locators:
        - {by: testid, value: "username", stability: high}
    - textbox "Password":
      value: "***"
      locators:
        - {by: testid, value: "password", stability: high}
    - button "login-button":
      value: "Login"
      locators:
        - {by: testid, value: "login-button", stability: high}
  - generic:
    locators:
      - {by: testid, value: "login-credentials-container", stability: high}
